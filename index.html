function promptSearch(){let it=currentTarget();showSearchCue(it);msg('Найди предмет с картинки','Посмотри на карточку слева и найди такой же предмет в комнате.')}
function room(){ $('objects').innerHTML=items.map(it=>`<button class="obj ${found.has(it.id)?'found':''}" data-id="${it.id}" aria-label="${it.name}" style="left:${it.x}%;top:${it.y}%;width:${it.w}%;height:${it.h}%">${icon(it.id)}</button>`).join('');document.querySelectorAll('.obj').forEach(el=>el.onclick=()=>find(el.dataset.id));}
function startSearch(full=true){mode=full?'full':'search';stage='search';found.clear();given.clear();pending=null;selected=null;$('overlay').classList.add('hidden');$('scene').classList.remove('hidden');$('sort').classList.add('hidden');$('heading').textContent='Найди подарки в комнате';$('sub').textContent='Нажимай на предметы со звуками [С] и [Ш]';$('mini').innerHTML='';$('next').classList.add('hidden');$('hint').classList.remove('hidden');$('searchNav').classList.add('active');$('sortNav').classList.remove('active');promptSearch();room();progress()}
function find(id){if(stage!=='search'||pending||found.has(id))return;let it=currentTarget();if(!it)return;if(id!==it.id){msg('Посмотри на картинку слева','Сейчас ищем предмет, который изображён на карточке.');return}found.add(id);pending=it;room();showSearchCue(it,true);msg(it.name,'Назови предмет. Скажи, где ты его нашёл.');$('next').textContent=found.size===12?'Все нашли! →':'Ищем дальше →';$('next').classList.remove('hidden');$('hint').classList.add('hidden');progress()}
function advance(){if(stage==='search'){pending=null;if(found.size===12){if(mode==='full')startSort();else finishSearch();return}$('mini').innerHTML='';$('next').classList.add('hidden');$('hint').classList.remove('hidden');promptSearch()}else if(stage==='sort'){pending=null;selected=null;$('mini').innerHTML='';$('next').classList.add('hidden');if(given.size===12){finish();return}msg('Кому подарим следующую находку?','Выбери картинку и нажми на героя или перетащи подарок.');renderSort()}}
function startSort(){clearSearchCue();stage='sort';pending=null;selected=null;given.clear();$('scene').classList.add('hidden');$('overlay').classList.add('hidden');$('sort').classList.remove('hidden');$('heading').textContent='Кому подарим находки?';$('sub').textContent='Сане — со звуком [С], Наташе — со звуком [Ш]';$('searchNav').classList.remove('active');$('sortNav').classList.add('active');$('hint').classList.add('hidden');$('next').classList.add('hidden');$('mini').innerHTML='';msg('Назови предмет и послушай звук','Перетащи картинку к герою или выбери картинку, затем героя.');renderSort();progress()}
function renderSort(){ $('sort').innerHTML=`<button class="hero" data-sound="С" aria-label="Подарить Сане">${kid(false)}<h3>Саня <span class="badge">С</span></h3><p>Подарки со звуком [С]</p><div class="collected">${items.filter(i=>given.has(i.id)&&i.sound==='С').map(i=>icon(i.id)).join('')}</div></button><div class="cards">${[0,6,1,7,2,8,3,9,4,10,5,11].map(i=>{let it=items[i];return `<button class="card ${given.has(it.id)?'done':''} ${selected===it.id?'selected':''}" data-id="${it.id}" draggable="${!pending}" aria-label="${it.name}" aria-pressed="${selected===it.id}" ${given.has(it.id)?'disabled':''}>${icon(it.id)}</button>`}).join('')}</div><button class="hero" data-sound="Ш" aria-label="Подарить Наташе">${kid(true)}<h3>Наташа <span class="badge">Ш</span></h3><p>Подарки со звуком [Ш]</p><div class="collected">${items.filter(i=>given.has(i.id)&&i.sound==='Ш').map(i=>icon(i.id)).join('')}</div></button>`;
document.querySelectorAll('.card:not(.done)').forEach(el=>{el.onclick=()=>select(el.dataset.id);el.ondragstart=e=>{if(pending){e.preventDefault();return}selected=el.dataset.id;e.dataTransfer.setData('text/plain',selected);e.dataTransfer.effectAllowed='move'};el.onpointerdown=e=>{if(e.pointerType==='mouse'||pending)return;el._point={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)};el.onpointerup=e=>{if(!el._point)return;let p=el._point;el._point=null;if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<10)return;let hero=document.elementFromPoint(e.clientX,e.clientY)?.closest('.hero');if(hero){selected=el.dataset.id;give(hero.dataset.sound)}}});document.querySelectorAll('.hero').forEach(el=>{el.onclick=()=>give(el.dataset.sound);el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();el.classList.remove('over');give(el.dataset.sound)}})}
function select(id){if(pending)return;selected=id;let it=items.find(i=>i.id===id);$('mini').innerHTML=icon(id);msg(it.name,'Какой звук слышишь: [С] или [Ш]? Кому отдашь подарок?');renderSort()}
function give(sound){if(pending)return;if(!selected){msg('Сначала выбери подарок','Нажми на одну из картинок посередине.');return}let it=items.find(i=>i.id===selected);if(it.sound!==sound){msg('Произнеси слово ещё раз','Какой звук ты слышишь? Попробуй подарить другому герою.');let card=document.querySelector(`.card[data-id="${it.id}"]`);card?.classList.add('shake');setTimeout(()=>card?.classList.remove('shake'),400);return}given.add(it.id);pending=it;msg(`${it.name} — ${sound==='С'?'Сане':'Наташе'}!`,`Скажи: «Я отдам ${it.acc} ${sound==='С'?'Сане':'Наташе'}».`);$('mini').innerHTML=icon(it.id);$('next').textContent=given.size===12?'На праздник! ✦':'Следующий подарок →';$('next').classList.remove('hidden');renderSort();progress()}
function finishSearch(){stage='searchDone';showOverlay(`<h2>Все предметы найдены!</h2><p>Ты нашёл и назвал 12 предметов. Теперь можно подарить их Сане и Наташе.</p><button class="primary" id="goSort">Кому подарим? →</button>`);$('goSort').onclick=startSort;$('next').classList.add('hidden')}
function showOverlay(content){$('overlay').innerHTML=`<div class="welcome">${content}</div>`;$('overlay').classList.remove('hidden')}
function finish(){stage='finish';$('sort').classList.add('hidden');$('scene').classList.remove('hidden');$('objects').innerHTML='';$('heading').textContent='Подарки нашли своих хозяев!';$('sub').textContent='Саня и Наташа благодарят тебя';$('next').classList.add('hidden');msg('С праздником!','Вспомни: какие подарки получил Саня? А Наташа?');showOverlay(`<div class="faces">${kid(false)}${kid(true)}</div><h2>Спасибо за подарки!</h2><p>Все 12 находок распределены.<br>Теперь можно встречать праздник!</p><button class="primary" id="again">Играть ещё раз</button>`);$('again').onclick=welcome;for(let i=0;i<18;i++){let el=document.createElement('span');el.className='spark';el.textContent=i%2?'❄':'✦';el.style.left=`${i*5.7}%`;el.style.animationDelay=`-${i*.23}s`;$('overlay').append(el)}}
function welcome(){clearSearchCue();stage='welcome';found.clear();given.clear();pending=null;selected=null;$('sort').classList.add('hidden');$('scene').classList.remove('hidden');$('heading').textContent='В гости к Сане и Наташе';$('sub').textContent='Найдём подарки и устроим праздник';$('hint').classList.add('hidden');$('next').classList.add('hidden');$('mini').innerHTML='';msg('Поможем найти подарки?','Сначала ищем и называем, потом дарим.');room();progress();showOverlay(`<div class="faces">${kid(false)}${kid(true)}</div><h2>Где же наши подарки?</h2><p>Помоги Сане и Наташе найти 12 предметов в новогодней комнате. Ищи предметы по картинке на карточке, называй находки, а затем подари их героям!</p><div class="actions"><button class="primary" id="full">Всё приключение →</button><button class="soft" id="onlySearch">Только поиск</button><button class="soft" id="onlySort">Кому подарим?</button></div>`);$('full').onclick=()=>startSearch();$('onlySearch').onclick=()=>startSearch(false);$('onlySort').onclick=startSort}
$('next').onclick=advance;$('hint').onclick=()=>{if(stage!=='search'||pending)return;let it=currentTarget();if(!it)return;let el=document.querySelector(`.obj[data-id="${it.id}"]`);el.classList.add('hint');setTimeout(()=>el.classList.remove('hint'),2500);msg(`Поищи: ${it.name.toLowerCase()}`,'Предмет ненадолго подсвечен в комнате.');};$('searchNav').onclick=()=>startSearch(false);$('sortNav').onclick=startSort;$('reset').onclick=welcome;welcome();
</script></html>
